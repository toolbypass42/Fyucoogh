<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tải Tool Bypass Link</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Poppins', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #0d0d0d;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255, 20, 147, 0.18), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(255, 105, 180, 0.15), transparent 45%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border: 3px solid #ff1493;
    border-radius: 22px;
    padding: 32px 28px 30px;
    box-shadow:
      0 0 0 6px rgba(255, 20, 147, 0.12),
      0 20px 50px rgba(255, 20, 147, 0.35),
      0 0 40px rgba(255, 20, 147, 0.25);
    position: relative;
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .badge {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 7px 22px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(255, 20, 147, 0.55);
    white-space: nowrap;
    text-transform: uppercase;
  }

  h1 {
    text-align: center;
    color: #0d0d0d;
    font-size: 22px;
    margin-top: 10px;
    margin-bottom: 6px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  h1 span { color: #ff1493; }

  .subtitle {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-bottom: 24px;
  }

  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: #ff1493;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .link-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff5fa;
    border: 2px solid #ffb6d9;
    border-radius: 14px;
    padding: 6px 6px 6px 14px;
    margin-bottom: 18px;
    transition: 0.25s;
  }

  .link-box:hover,
  .link-box:focus-within {
    border-color: #ff1493;
    box-shadow: 0 0 0 4px rgba(255, 20, 147, 0.15);
  }

  .link-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 13px;
    color: #333;
    font-weight: 600;
    min-width: 0;
    padding: 8px 0;
  }

  .copy-btn {
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    transition: 0.2s;
    white-space: nowrap;
  }

  .copy-btn:hover { filter: brightness(1.1); transform: scale(1.04); }
  .copy-btn:active { transform: scale(0.96); }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    text-decoration: none;
    letter-spacing: 0.4px;
    transition: 0.22s;
    text-transform: uppercase;
  }

  .btn-main {
    background: linear-gradient(135deg, #ff1493, #ff3ea5);
    color: #fff;
    box-shadow: 0 10px 26px rgba(255, 20, 147, 0.45);
    margin-bottom: 14px;
  }

  .btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(255, 20, 147, 0.6);
  }

  .btn-main:active { transform: translateY(0); }

  .backup-label {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #0d0d0d;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin: 4px 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .backup-label::before,
  .backup-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ffb6d9, transparent);
  }

  .btn-backup {
    background: #0d0d0d;
    color: #ff69b4;
    border: 2px solid #ff1493;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
  }

  .btn-backup:hover {
    background: #1a1a1a;
    color: #fff;
    border-color: #ff69b4;
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(255, 20, 147, 0.35);
  }

  .btn-backup:active { transform: translateY(0); }

  .note {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-top: 22px;
    line-height: 1.6;
  }

  .note b { color: #ff1493; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translate(-50%, 80px);
    background: #0d0d0d;
    color: #ff69b4;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    border: 2px solid #ff1493;
    box-shadow: 0 8px 24px rgba(255, 20, 147, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: 0.35s;
    z-index: 99;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="badge">✦ Tool Chính Thức ✦</div>

    <!-- Đã đổi tiêu đề tại đây -->
    <h1>Tải <span>Tool</span> Bypass Link</h1>
    <p class="subtitle">Nhấn vào link bên dưới để tải và sử dụng tool</p>

    <label class="field-label">Link chính</label>
    <div class="link-box">
      <input type="text" id="mainLink" readonly
             value="https://phienchoso.com/da1caa9c673452ba8e68.tk">
      <button class="copy-btn" onclick="copyLink('mainLink', this)">Copy</button>
    </div>

    <a class="btn btn-main" href="https://phienchoso.com/da1caa9c673452ba8e68.tk" target="_blank" rel="noopener">
      🚀 Tải Tool Tại Đây
    </a>

    <div class="backup-label">Link dự phòng khi lỗi</div>

    <div class="link-box">
      <input type="text" id="backupLink" readonly
             value="https://traffictop.net/DIZq1H">
      <button class="copy-btn" onclick="copyLink('backupLink', this)">Copy</button>
    </div>

    <a class="btn btn-backup" href="https://traffictop.net/DIZq1H" target="_blank" rel="noopener">
      🛠️ Tải Link Dự Phòng
    </a>

    <p class="note">
      Nếu link chính gặp sự cố, hãy dùng <b>link dự phòng</b> để tiếp tục.
    </p>
  </div>

  <div class="toast" id="toast">✅ Đã copy link!</div>

  <script>
    function copyLink(id, btn) {
      const input = document.getElementById(id);
      const text = input.value;

      const done = () => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        const old = btn.textContent;
        btn.textContent = '✓ Đã Copy';
        setTimeout(() => {
          toast.classList.remove('show');
          btn.textContent = old;
        }, 1600);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallback());
      } else {
        fallback();
      }

      function fallback() {
        input.removeAttribute('readonly');
        input.select();
        input.setSelectionRange(0, 99999);
        try { document.execCommand('copy'); done(); } catch (e) { alert('Không copy được, hãy copy thủ công!'); }
        input.setAttribute('readonly', true);
      }
    }
  </script>

</body>
</html>
